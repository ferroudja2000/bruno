info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: https://api.efi-academy.com/user-api/public/register
  body:
    type: json
    data: |-
      {
        "name": "Jean Dupont",
        "email": "{{$randomEmail}}",
        "password": "secret123",
        "role": "{{randomRole}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: 'bru.setVar("randomRole", Math.random() < 0.6 ? "admin" : "user");'
    - type: after-response
      code: |-
        test ("verifier le code 201 ", ()=>{
          let response = res.getStatus();
          expect(response).to.equal(201); 
        })

        test ("verifier le code envoyé et le code reçu ", ()=>{
          let response = res.getBody();
          let requestBody = req.getBody();
          
          expect(response.user.name).to.equal(requestBody.name);
          expect(response.user.email).to.equal(requestBody.email);
          expect(response.user.role).to.equal(requestBody.role);
          
          bru.setCollectionVar('id', response.user.id);
          bru.setCollectionVar('email', response.user.email);
          //bru.setCollectionVar("password", response.user.password);
          bru.setCollectionVar("role", response.user.role);
          
          
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
