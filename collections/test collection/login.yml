info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: https://api.efi-academy.com/user-api/public/login
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "secret123"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let email = bru.getCollectionVar("email");
        //bru.setVar("password",reqbody.password);
    - type: after-response
      code: |-
        test ("verifier le code 200 ", ()=>{
          let response = res.getStatus();
          expect(response).to.equal(200);
          
          
        })

        test ("verifier que le token existe", ()=>{
          let body = res.getBody();
          bru.setCollectionVar("token", body.token);
          
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
